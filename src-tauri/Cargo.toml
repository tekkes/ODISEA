[package]
name = "odisea"
version = "1.0.1"
description = "Odisea - Ulysses replica for Windows 11"
authors = ["Odisea Team"]
license = "MIT"
edition = "2021"

[lib]
name = "odisea_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Odisea"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.2", features = [] }
tauri-plugin-opener = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.33", features = ["bundled"] }
notify = "7.0"
zstd = "0.13"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
regex = "1.10"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
ureq = { version = "3.4.2", features = ["json"] }
base64 = "0.23.1"
ring = "0.17"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
