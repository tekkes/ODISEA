# ==============================================================================
# Odisea - Configuración General
# ==============================================================================

[general]
app_name = "Odisea"
version = "0.1.0"
portable = true
language = "es"

[ui]
# Modo visual activo: "focus", "normal", "distraction_free", "zen"
active_visual_mode = "focus"
# Tema activo
active_theme = "default"
# Barras de interfaz
show_sidebar = true
show_statusbar = true
show_toolbar = true
compact_mode = false

[editor]
font_family = "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
font_size = 15
line_height = 1.6
cursor_blinking = true
spellcheck = true
auto_save_seconds = 10

[shortcuts]
new_note = "Ctrl+N"
new_project = "Ctrl+Shift+N"
quick_search = "Ctrl+P"
global_search = "Ctrl+Shift+F"
toggle_sidebar = "Ctrl+B"
toggle_focus_mode = "F11"
export_document = "Ctrl+E"

[database]
path = "library.odiseadb"
enable_fts = true
wal_mode = true

[attachments]
storage_dir = "attachments"
hash_algorithm = "SHA-256"

[backups]
enabled = true
storage_dir = "backups"
compression = "zstd"
schedule = ["hourly", "daily", "weekly"]
max_snapshots = 30

[webview]
profile_dir = "webview_profile"
isolated_cache = true
